<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTR Review</title>
  <style>
    :root {
      --bg: #f1efe7;
      --panel: #fbfaf6;
      --line: #d4cfbf;
      --text: #1f1d19;
      --muted: #6f6a5d;
      --accent: #1f5eff;
      --accent-2: #d94f04;
      --ok: #2f7d32;
      --todo: #8b3a14;
      --teryt: #1a6b3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #fff6d9 0, transparent 28%),
        radial-gradient(circle at bottom right, #e5ece6 0, transparent 30%),
        var(--bg);
    }
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(251, 250, 246, 0.92);
      backdrop-filter: blur(8px);
      padding: 18px;
      overflow: auto;
    }
    .main {
      padding: 22px;
      display: grid;
      gap: 16px;
      grid-template-rows: auto auto 1fr;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0.02em;
    }
    .muted {
      color: var(--muted);
      font-size: 14px;
    }
    .toolbar, .editor-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.06);
    }
    .toolbar.panel, .editor-bar.panel {
      padding: 12px;
    }
    .viewer {
      display: grid;
      grid-template-columns: minmax(320px, 48%) 1fr;
      gap: 16px;
      min-height: 0;
    }
    .image-wrap, .edit-wrap {
      min-height: 0;
      padding: 14px;
    }
    .image-scroll {
      overflow: auto;
      max-height: 62vh;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: white;
      position: relative;
    }
    .image-wrap img {
      display: block;
      height: auto;
      width: 100%;
      cursor: zoom-in;
      transition: width 0.1s;
    }
    .zoom-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .zoom-bar button {
      padding: 4px 10px;
      font-size: 15px;
      line-height: 1;
    }
    .zoom-label {
      font-size: 13px;
      color: var(--muted);
      min-width: 38px;
    }
    .meta {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }
    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.45;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      background: #e7e1d3;
      color: var(--text);
    }
    button.primary {
      background: var(--accent);
      color: white;
    }
    button.warn {
      background: var(--accent-2);
      color: white;
    }
    button.teryt-btn {
      background: var(--teryt);
      color: white;
      padding: 6px 12px;
      font-size: 13px;
    }
    .list {
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
    }
    .item.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .item-title {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }
    .item-sub {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #efe9db;
    }
    .pill.todo { color: var(--todo); }
    .pill.ready, .pill.done { color: var(--ok); }
    .counter {
      margin-left: auto;
      font-size: 13px;
      color: var(--muted);
    }
    .status {
      min-width: 120px;
    }
    .path {
      word-break: break-all;
      color: var(--muted);
    }

    /* TERYT panel */
    .teryt-panel {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .teryt-suggestion {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #e8f5ec;
      border: 1px solid #a8d5b5;
      border-radius: 10px;
      padding: 8px 12px;
      margin: 8px 0;
      font-size: 14px;
    }
    .teryt-suggestion strong { color: var(--teryt); }
    .teryt-suggestion .dismiss {
      margin-left: auto;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      background: none;
      border: none;
      padding: 0 4px;
    }
    .teryt-search-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .teryt-search-row input {
      flex: 1;
      padding: 7px 12px;
      font-size: 14px;
    }
    .teryt-results {
      margin-top: 8px;
      display: grid;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }
    .teryt-result {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .teryt-result:hover { border-color: var(--teryt); }
    .teryt-result .place-name { font-weight: 700; }
    .teryt-result .place-addr { color: var(--muted); font-size: 12px; }
    .teryt-status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    #regionInfo {
      font-size: 12px;
      color: var(--teryt);
      margin-bottom: 4px;
    }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .viewer { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>HTR Review</h1>
      <div class="muted">Ctrl+S zapisuje. Strzalki lewo/prawo przechodza miedzy rekordami.</div>
      <div class="toolbar panel" style="margin-top: 14px;">
        <div style="flex: 1 1 180px;">
          <div class="label">Filtr statusu</div>
          <select id="filterStatus">
            <option value="">Wszystkie</option>
            <option value="todo">todo</option>
            <option value="ready">ready</option>
            <option value="done">done</option>
          </select>
        </div>
        <div style="flex: 1 1 180px;">
          <div class="label">Szukaj</div>
          <input id="searchBox" placeholder="plik, notatka, status">
        </div>
      </div>
      <div id="list" class="list"></div>
    </aside>
    <main class="main">
      <div class="toolbar panel">
        <button id="prevBtn">Poprzedni</button>
        <button id="nextBtn">Nastepny</button>
        <button id="saveBtn" class="primary">Zapisz</button>
        <button id="markReadyBtn" class="warn">Zapisz jako ready</button>
        <button id="deleteBtn" style="background:#c0392b;color:white;" title="Usun ten wiersz z manifestu (pliki zostaja na dysku)">Usun</button>
        <button id="shiftOcrMinus" style="background:#7b5ea7;color:white;" title="Przesuń OCR calej strony o -1 (gdy Kraken wykryl dodatkowy naglowek)">OCR strona &#x2212;1</button>
        <button id="shiftOcrPlus" style="background:#7b5ea7;color:white;" title="Przesuń OCR calej strony o +1">OCR strona +1</button>
        <div id="counter" class="counter">0 / 0</div>
      </div>
      <div class="editor-bar panel">
        <div style="flex: 1 1 240px;">
          <div class="label">Status</div>
          <select id="statusSelect" class="status">
            <option value="todo">todo</option>
            <option value="ready">ready</option>
            <option value="done">done</option>
          </select>
        </div>
        <div style="flex: 3 1 420px;">
          <div class="label">Notatki</div>
          <input id="notesInput" placeholder="np. nieczytelne nazwisko, uszkodzony skan">
        </div>
      </div>
      <div class="viewer">
        <section class="panel image-wrap">
          <div class="meta">
            <div>
              <div class="label">Obraz</div>
              <div id="imageName"></div>
            </div>
            <div>
              <div class="label">Sciezka</div>
              <div id="imagePath" class="path"></div>
            </div>
          </div>
          <div class="zoom-bar">
            <button onclick="zoomOut()" title="Pomniejsz">&#x2212;</button>
            <button onclick="zoomReset()" title="Resetuj zoom">1:1</button>
            <button onclick="zoomIn()" title="Powieksz">+</button>
            <span class="zoom-label" id="zoomLabel">100%</span>
          </div>
          <div class="image-scroll" id="imageScroll">
            <img id="image" alt="sample">
          </div>
        </section>
        <section class="panel edit-wrap">
          <div class="meta">
            <div>
              <div class="label">Plik transkrypcji</div>
              <div id="textPath" class="path"></div>
            </div>
          </div>
          <textarea id="textArea" spellcheck="false"></textarea>

          <!-- TERYT panel -->
          <div class="teryt-panel" id="terytPanel">
            <div class="label">TERYT - weryfikacja miejscowosci</div>
            <div id="regionInfo"></div>
            <div class="teryt-search-row" style="margin-top:4px;margin-bottom:4px;">
              <input id="regionInput" placeholder="Zmien region (np. gmina Wysoka)" style="flex:1;font-size:13px;">
              <button class="teryt-btn" id="regionSetBtn">Ustaw</button>
            </div>
            <div id="terytSuggestion" class="teryt-suggestion" style="display:none">
              <span id="terytSuggText"></span>
              <button class="teryt-btn" id="terytAcceptBtn" title="Wstaw nazwe do notatek">Wstaw</button>
              <button class="dismiss" id="terytDismissBtn" title="Odrzuc">x</button>
            </div>
            <div class="teryt-search-row">
              <input id="terytSearch" placeholder="Szukaj miejscowosci..." autocomplete="off">
              <button class="teryt-btn" id="terytSearchBtn">Szukaj</button>
            </div>
            <div id="terytStatus" class="teryt-status"></div>
            <div id="terytResults" class="teryt-results"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script>
    let items = [];
    let filteredItems = [];
    let currentIndex = -1;
    let terytRegion = null;
    let terytSuggestedName = '';

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);
      if (!response.ok) {
        throw new Error(await response.text());
      }
      return await response.json();
    }

    const STATUS_ORDER = { todo: 0, ready: 1, done: 2 };

    function applyFilter() {
      const status = document.getElementById('filterStatus').value.trim().toLowerCase();
      const query = document.getElementById('searchBox').value.trim().toLowerCase();
      filteredItems = items.filter(item => {
        const statusOk = !status || item.status.toLowerCase() === status;
        const hay = [item.image_name, item.status, item.notes, item.manual_text_path].join(' ').toLowerCase();
        const queryOk = !query || hay.includes(query);
        return statusOk && queryOk;
      });
      if (!status) {
        filteredItems.sort((a, b) => {
          const sa = STATUS_ORDER[a.status] ?? 0;
          const sb = STATUS_ORDER[b.status] ?? 0;
          return sa !== sb ? sa - sb : a.id - b.id;
        });
      }
      renderList();
      if (!filteredItems.length) {
        currentIndex = -1;
        clearEditor();
        return;
      }
      const currentId = getCurrentItem()?.id;
      const nextIndex = filteredItems.findIndex(item => item.id === currentId);
      openItem(nextIndex >= 0 ? nextIndex : 0);
    }

    function renderList() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      filteredItems.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'item' + (idx === currentIndex ? ' active' : '');
        div.onclick = () => openItem(idx);
        div.innerHTML = `
          <div class="item-title">${escapeHtml(item.image_name)}</div>
          <div class="item-sub">
            <span class="pill ${escapeHtml(item.status)}">${escapeHtml(item.status || 'todo')}</span>
            <span>${item.text_length || 0} zn.</span>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function clearEditor() {
      document.getElementById('image').removeAttribute('src');
      document.getElementById('imageName').textContent = '';
      document.getElementById('imagePath').textContent = '';
      document.getElementById('textPath').textContent = '';
      document.getElementById('textArea').value = '';
      document.getElementById('notesInput').value = '';
      document.getElementById('statusSelect').value = 'todo';
      clearTeryt();
      updateCounter();
    }

    function getCurrentItem() {
      if (currentIndex < 0 || currentIndex >= filteredItems.length) {
        return null;
      }
      return filteredItems[currentIndex];
    }

    async function openItem(index) {
      if (index < 0 || index >= filteredItems.length) {
        return;
      }
      currentIndex = index;
      renderList();
      updateCounter();
      const item = filteredItems[index];
      const data = await fetchJson(`/api/item?id=${item.id}`);
      document.getElementById('image').src = `/image?id=${item.id}&v=${Date.now()}`;
      document.getElementById('imageName').textContent = data.image_name;
      document.getElementById('imagePath').textContent = data.image_path;
      document.getElementById('textPath').textContent = data.manual_text_path;
      document.getElementById('textArea').value = data.text || '';
      document.getElementById('notesInput').value = data.notes || '';
      document.getElementById('statusSelect').value = data.status || 'todo';
      clearTeryt();
      autoSuggestTeryt(data.text || '');
    }

    function updateCounter() {
      const current = filteredItems.length ? currentIndex + 1 : 0;
      document.getElementById('counter').textContent = `${current} / ${filteredItems.length}`;
    }

    async function saveCurrent(forceStatus = null) {
      const item = getCurrentItem();
      if (!item) return;
      const payload = {
        id: item.id,
        text: document.getElementById('textArea').value,
        notes: document.getElementById('notesInput').value,
        status: forceStatus || document.getElementById('statusSelect').value,
      };
      const data = await fetchJson('/api/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      items = data.items;
      applyFilter();
      const newIndex = filteredItems.findIndex(entry => entry.id === item.id);
      if (newIndex >= 0) {
        currentIndex = newIndex;
        renderList();
        updateCounter();
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    // --- TERYT ---

    function clearTeryt() {
      document.getElementById('terytSuggestion').style.display = 'none';
      document.getElementById('terytSuggText').textContent = '';
      document.getElementById('terytResults').innerHTML = '';
      document.getElementById('terytStatus').textContent = '';
      document.getElementById('terytSearch').value = '';
      terytSuggestedName = '';
    }

    function extractPlaceWords(text) {
      // extract capitalized words >3 chars that look like place names
      // skip common table separators and numbers
      const skip = new Set(['True','False','None']);
      const words = text.split(/[\s|,;.]+/);
      const candidates = [];
      for (const w of words) {
        const clean = w.trim();
        if (clean.length < 3) continue;
        if (/^[0-9]/.test(clean)) continue;
        if (skip.has(clean)) continue;
        if (/^[A-ZĄĆĘŁŃÓŚŹŻ]/.test(clean)) {
          candidates.push(clean);
        }
      }
      return [...new Set(candidates)];
    }

    async function autoSuggestTeryt(text) {
      if (!text.trim()) return;
      const words = extractPlaceWords(text);
      if (!words.length) return;
      // try first capitalized word
      const query = words[0];
      try {
        const data = await fetchJson(`/api/teryt/search?q=${encodeURIComponent(query)}`);
        if (data.results && data.results.length > 0) {
          const top = data.results[0];
          terytSuggestedName = top.name;
          const suggEl = document.getElementById('terytSuggestion');
          const suggText = document.getElementById('terytSuggText');
          suggText.innerHTML = `Czy chodzilo o: <strong>${escapeHtml(top.name)}</strong> <span style="color:var(--muted);font-size:12px">(${escapeHtml(top.address)})</span>`;
          suggEl.style.display = 'flex';
        }
      } catch (e) {
        // silent fail for auto-suggest
      }
    }

    async function searchTeryt() {
      const q = document.getElementById('terytSearch').value.trim();
      if (!q) return;
      const statusEl = document.getElementById('terytStatus');
      const resultsEl = document.getElementById('terytResults');
      statusEl.textContent = 'Szukam...';
      resultsEl.innerHTML = '';
      try {
        const data = await fetchJson(`/api/teryt/search?q=${encodeURIComponent(q)}`);
        statusEl.textContent = data.results.length ? `Znaleziono: ${data.results.length}` : 'Brak wynikow.';
        renderTerytResults(data.results);
      } catch (e) {
        statusEl.textContent = 'Blad zapytania: ' + e.message;
      }
    }

    function renderTerytResults(results) {
      const el = document.getElementById('terytResults');
      el.innerHTML = '';
      results.forEach(r => {
        const div = document.createElement('div');
        div.className = 'teryt-result';
        div.innerHTML = `
          <div>
            <div class="place-name">${escapeHtml(r.name)}</div>
            <div class="place-addr">${escapeHtml(r.address)}</div>
          </div>
          <button class="teryt-btn" onclick="insertTeryt(${escapeHtml(JSON.stringify(r.name))})">Wstaw</button>
        `;
        el.appendChild(div);
      });
    }

    function insertTeryt(name) {
      const ta = document.getElementById('textArea');
      const notes = document.getElementById('notesInput');
      const existing = notes.value.trim();
      notes.value = existing ? existing + ' | TERYT: ' + name : 'TERYT: ' + name;
    }

    // --- Zoom ---
    let zoomPct = 100;
    function applyZoom() {
      const img = document.getElementById('image');
      img.style.width = zoomPct + '%';
      document.getElementById('zoomLabel').textContent = zoomPct + '%';
    }
    function zoomIn()    { zoomPct = Math.min(zoomPct * 1.25, 800); applyZoom(); }
    function zoomOut()   { zoomPct = Math.max(zoomPct / 1.25, 25);  applyZoom(); }
    function zoomReset() { zoomPct = 100; applyZoom(); }
    document.getElementById('imageScroll').addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      if (e.deltaY < 0) zoomIn(); else zoomOut();
    }, { passive: false });

    // --- Region ---
    async function initRegion() {
      try {
        const data = await fetchJson('/api/teryt/region');
        if (data.region) {
          document.getElementById('regionInfo').textContent = 'Region: ' + data.region;
          document.getElementById('regionInput').value = data.region;
        } else {
          document.getElementById('regionInfo').textContent = 'Brak ograniczenia regionu';
        }
      } catch (e) { /* ignore */ }
    }

    async function setRegion() {
      const val = document.getElementById('regionInput').value.trim();
      const statusEl = document.getElementById('terytStatus');
      statusEl.textContent = 'Ustawianie regionu...';
      try {
        const data = await fetchJson('/api/teryt/setregion', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ region: val }),
        });
        document.getElementById('regionInfo').textContent = data.region ? 'Region: ' + data.region : 'Brak ograniczenia regionu';
        statusEl.textContent = data.region ? 'Region ustawiony.' : 'Region wyczyszczony.';
      } catch (e) {
        statusEl.textContent = 'Blad: ' + e.message;
      }
    }
    document.getElementById('regionSetBtn').addEventListener('click', setRegion);
    document.getElementById('regionInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') setRegion();
    });

    document.getElementById('terytAcceptBtn').addEventListener('click', () => {
      if (terytSuggestedName) insertTeryt(terytSuggestedName);
    });
    document.getElementById('terytDismissBtn').addEventListener('click', () => {
      document.getElementById('terytSuggestion').style.display = 'none';
    });
    document.getElementById('terytSearchBtn').addEventListener('click', searchTeryt);
    document.getElementById('terytSearch').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchTeryt();
    });

    async function init() {
      await initRegion();
      const data = await fetchJson('/api/items');
      items = data.items;
      filteredItems = items.slice();
      renderList();
      if (filteredItems.length) {
        await openItem(0);
      }
      updateCounter();
    }

    document.getElementById('filterStatus').addEventListener('change', applyFilter);
    document.getElementById('searchBox').addEventListener('input', applyFilter);
    document.getElementById('prevBtn').addEventListener('click', () => openItem(Math.max(0, currentIndex - 1)));
    document.getElementById('nextBtn').addEventListener('click', () => openItem(Math.min(filteredItems.length - 1, currentIndex + 1)));
    document.getElementById('saveBtn').addEventListener('click', () => saveCurrent());
    document.getElementById('markReadyBtn').addEventListener('click', () => saveCurrent('ready'));
    async function shiftOcr(offset) {
      const item = getCurrentItem();
      if (!item) return;
      const sign = offset > 0 ? '+' : '';
      if (!confirm('Przesunac OCR calej strony o ' + sign + offset + '?
Zmieni gt_text dla wszystkich wierszy tej strony.')) return;
      try {
        const data = await fetchJson('/api/shift_ocr', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id: item.id, offset: offset }),
        });
        items = data.items;
        applyFilter();
        const newIndex = filteredItems.findIndex(i => i.id === item.id);
        if (newIndex >= 0) await openItem(newIndex);
        alert('Przesunieto OCR dla ' + data.updated + ' wierszy strony.');
      } catch (e) {
        alert('Blad przesuwania OCR: ' + e.message);
      }
    }
    document.getElementById('shiftOcrMinus').addEventListener('click', () => shiftOcr(-1));
    document.getElementById('shiftOcrPlus').addEventListener('click', () => shiftOcr(+1));

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      const item = getCurrentItem();
      if (!item) return;
      if (!confirm(`Usunac "${item.image_name}" z manifestu i dysku?`)) return;
      try {
        const data = await fetchJson('/api/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id: item.id }),
        });
        items = data.items;
        applyFilter();
        const next = Math.min(currentIndex, filteredItems.length - 1);
        if (next >= 0) openItem(next); else clearEditor();
      } catch (e) {
        alert('Blad usuwania: ' + e.message);
      }
    });
    document.addEventListener('keydown', async (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        await saveCurrent();
      }
      if (event.key === 'ArrowLeft' && !event.ctrlKey && !event.metaKey) {
        openItem(Math.max(0, currentIndex - 1));
      }
      if (event.key === 'ArrowRight' && !event.ctrlKey && !event.metaKey) {
        openItem(Math.min(filteredItems.length - 1, currentIndex + 1));
      }
    });
    init();
  </script>
</body>
</html>
